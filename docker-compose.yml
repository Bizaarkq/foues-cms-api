# Production base compose file. Lives in the foues-cms-api repo; the frontend
# repo must be cloned as a sibling directory (../foues-cms-frontend).
# Dev mode:  docker compose up            (auto-merges docker-compose.override.yml)
# Prod mode: docker compose -f docker-compose.yml up --build
# Seeds:     docker compose -f docker-compose.yml run --rm foues-cms-api pnpm data:migrate

# Pinned so containers, networks and the db volume keep the same identity as
# when this file lived in the parent directory (default name = dir name).
name: foues

services:
  db:
    image: mysql:8.0
    container_name: db
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - foues-cms-db:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  foues-cms-api:
    container_name: cms
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ENV: ${BUILD_ENV:-production}
    restart: unless-stopped
    environment:
      DATABASE_CLIENT: mysql
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USERNAME: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DATABASE_SSL: "false"
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY}
      JWT_SECRET: ${STRAPI_JWT_SECRET:-defaultjwtsecret}
      NODE_ENV: ${BUILD_ENV:-production}
    ports:
      - "8000:1337"
    networks:
      - backend
      - foues
    volumes:
      - foues-cms-uploads:/opt/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider --quiet http://localhost:1337/_health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  foues-cms-frontend:
    container_name: foues
    build:
      context: ../foues-cms-frontend
      dockerfile: Dockerfile
      args:
        STRAPI_URL: ${STRAPI_URL}
        STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
        FORM_SUBMIT_TOKEN: ${FORM_SUBMIT_TOKEN}
    restart: unless-stopped
    environment:
      STRAPI_URL: ${STRAPI_URL}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      FORM_SUBMIT_TOKEN: ${FORM_SUBMIT_TOKEN}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      NEXTAUTH_URL: ${AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      MAGAZINE_TRACK_TOKEN: ${MAGAZINE_TRACK_TOKEN}
    ports:
      - "3000:3000"
    networks:
      - foues
    depends_on:
      foues-cms-api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider --quiet http://localhost:3000 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  foues-cms-db:
  foues-cms-uploads:

networks:
  foues:
    name: foues
    driver: bridge
  backend:
    name: foues-backend
    driver: bridge
    internal: true
