# Production base compose file. Lives in the foues-cms-api repo; the frontend
# repo must be cloned as a sibling directory (../foues-cms-frontend).
# Dev mode:  docker compose up            (auto-merges docker-compose.override.yml)
# Prod mode: docker compose -f docker-compose.yml up --build
# Seeds:     docker compose run --rm cms pnpm data:migrate

# Pinned so containers, networks and the db volume keep the same identity as
# when this file lived in the parent directory (default name = dir name).
name: foues

services:
  db:
    image: mysql:8.0
    container_name: db
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - foues-cms-db:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cms:
    container_name: cms
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ENV: ${BUILD_ENV:-production}
    restart: unless-stopped
    environment:
      DATABASE_CLIENT: mysql
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USERNAME: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DATABASE_SSL: "false"
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY}
      # Sin fallback a propósito: mejor fallar el arranque que un secret conocido
      JWT_SECRET: ${STRAPI_JWT_SECRET:?STRAPI_JWT_SECRET is required — run scripts/generate-env.sh}
      NODE_ENV: ${BUILD_ENV:-production}
      # Origen público del sitio Next (allowlist CORS para la subida directa de
      # documentos). Se compone desde FRONTEND_DOMAIN — un solo valor fuente; el
      # esquema se declara aquí porque el dominio solo no basta para CORS.
      SITE_ORIGIN: https://${FRONTEND_DOMAIN:?FRONTEND_DOMAIN is required — set it in .env}
      # Secreto compartido con el frontend: deja pasar las lecturas server-to-server
      # del proxy de descargas a los archivos protegidos bajo "Documents".
      # Sin fallback a propósito (misma política que JWT_SECRET).
      DOCUMENT_ACCESS_SECRET: ${DOCUMENT_ACCESS_SECRET:?DOCUMENT_ACCESS_SECRET is required — run scripts/generate-env.sh}
    networks:
      - backend
      - foues
    volumes:
      - foues-cms-uploads:/opt/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider --quiet http://127.0.0.1:1337/_health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # Dominios públicos — sustituidos por envsubst en el template al arrancar.
      # Sin fallback a propósito: los dominios se declaran en .env
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:?FRONTEND_DOMAIN is required — set it in .env}
      CMS_DOMAIN: ${CMS_DOMAIN:?CMS_DOMAIN is required — set it in .env}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    networks:
      - foues
    depends_on:
      foues:
        condition: service_healthy

  foues:
    container_name: foues
    build:
      context: ../foues-cms-frontend
      dockerfile: Dockerfile
      args:
        STRAPI_URL: ${STRAPI_URL}
        STRAPI_PUBLIC_URL: ${STRAPI_PUBLIC_URL:-}
        STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
        FORM_SUBMIT_TOKEN: ${FORM_SUBMIT_TOKEN}
    restart: unless-stopped
    environment:
      STRAPI_URL: ${STRAPI_URL}
      STRAPI_PUBLIC_URL: ${STRAPI_PUBLIC_URL:-}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      FORM_SUBMIT_TOKEN: ${FORM_SUBMIT_TOKEN}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      NEXTAUTH_URL: ${AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      MAGAZINE_TRACK_TOKEN: ${MAGAZINE_TRACK_TOKEN}
      SITE_USER_TOKEN: ${SITE_USER_TOKEN}
      # Repositorio de documentos: token restringido (lecturas + emisión de
      # tickets + log de descargas) y el secreto compartido con el middleware
      # document-access del CMS. lib/env.ts falla el arranque si faltan.
      DOCUMENT_TOKEN: ${DOCUMENT_TOKEN:?DOCUMENT_TOKEN is required — run scripts/create-api-tokens.js}
      DOCUMENT_ACCESS_SECRET: ${DOCUMENT_ACCESS_SECRET:?DOCUMENT_ACCESS_SECRET is required — run scripts/generate-env.sh}
      # Opcional: URL del Campus Virtual en el navbar; vacía = link oculto
      CAMPUS_VIRTUAL_URL: ${CAMPUS_VIRTUAL_URL:-}
    networks:
      - foues
    depends_on:
      cms:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider --quiet http://127.0.0.1:3000 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  foues-cms-db:
  foues-cms-uploads:

networks:
  foues:
    name: foues
    driver: bridge
  backend:
    name: foues-backend
    driver: bridge
    internal: true
